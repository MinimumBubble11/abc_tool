<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高一语文上学期·期中备考·理解性默写互动课件</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap');

        :root {
            --primary: #8b261e;          /* 朱砂红 */
            --primary-dark: #6e1c15;
            --bg: #f8f6f0;               /* 宣纸底色 */
            --ink: #1f2429;              /* 深焦墨 */
            --ink-light: #5c6873;        /* 灰墨 */
            --success: #1f5e41;          /* 黛绿 */
            --card-bg: #ffffff;
            --border: #d4ccb9;           /* 典雅古纸边框 */
            --font-serif: "Noto Serif SC", "Songti SC", "Source Han Serif SC", "STSong", "SimSun", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --shadow: 0 20px 50px rgba(31, 36, 41, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: var(--font-serif);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: radial-gradient(#e5e0d3 1px, transparent 1px);
            background-size: 32px 32px;
            position: relative;
            user-select: none;
        }

        /* 顶部右侧按钮栏 */
        .top-actions {
            position: absolute;
            top: clamp(10px, 2.2vh, 25px);
            right: clamp(12px, 2.4vw, 35px);
            display: flex;
            gap: 12px;
            z-index: 1000;
        }

        .btn-top {
            background: rgba(248, 246, 240, 0.95);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: clamp(5px, 1vh, 8px) clamp(12px, 1.8vw, 20px);
            font-size: clamp(0.9rem, 1.7vh, 1.15rem);
            font-weight: 700;
            font-family: var(--font-sans);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(139, 38, 30, 0.1);
        }
        .btn-top:hover { background: var(--primary); color: #fff; }

        .copyright {
            position: absolute;
            bottom: 6px;
            left: 18px;
            font-size: 12px;
            color: var(--ink-light);
            opacity: 0.5;
            font-family: var(--font-sans);
            z-index: 100;
            pointer-events: none;
            letter-spacing: 1px;
        }
        .shortcuts-tip {
            position: absolute;
            bottom: 6px;
            right: 18px;
            font-size: 12px;
            color: var(--ink-light);
            opacity: 0.6;
            font-family: var(--font-sans);
            z-index: 100;
            pointer-events: none;
        }

        /* 封面页 */
        #cover-page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: var(--bg);
            background-image: radial-gradient(#e5e0d3 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 500;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            text-align: center;
            padding: 20px;
        }
        .cover-badge {
            display: inline-block;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 5px clamp(12px, 2vw, 22px);
            font-size: clamp(0.95rem, 1.9vw, 1.3rem);
            font-weight: 700;
            border-radius: 25px;
            margin-bottom: clamp(12px, 2.6vh, 25px);
            letter-spacing: clamp(2px, 0.5vw, 5px);
        }
        .cover-title {
            font-size: clamp(2rem, 6vw, 4.8rem); font-weight: 900; color: var(--primary);
            letter-spacing: clamp(2px, 0.9vw, 8px); margin-bottom: clamp(10px, 2.4vh, 20px); line-height: 1.25;
            text-shadow: 3px 3px 0px rgba(139, 38, 30, 0.12);
        }
        .cover-subtitle {
            font-size: clamp(1.05rem, 2.4vw, 2.1rem); color: var(--ink); letter-spacing: clamp(2px, 0.6vw, 4px);
            margin-bottom: clamp(26px, 7vh, 60px); font-weight: 700;
        }
        .btn-enter {
            background-color: var(--primary); color: #fff; border: none;
            padding: clamp(12px, 2.2vh, 18px) clamp(28px, 5vw, 60px); font-size: clamp(1.15rem, 2.4vw, 1.8rem); font-weight: 900;
            font-family: var(--font-serif); border-radius: 45px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(139, 38, 30, 0.35);
            transition: transform 0.2s ease, background 0.2s ease;
            letter-spacing: 4px;
        }
        .btn-enter:hover { transform: scale(1.05); background-color: var(--primary-dark); }

        /* 主界面 */
        #main-app {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: clamp(44px, 8vh, 70px) clamp(14px, 3vw, 40px) 26px;
            opacity: 0; visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            height: 100vh; width: 100%;
        }

        .scene {
            width: 100%; max-width: 1380px; flex: 1; min-height: 0;
            perspective: 2500px; margin-bottom: clamp(8px, 1.6vh, 20px);
            display: flex; justify-content: center; align-items: center;
        }

        .card {
            width: 100%; height: 100%; position: relative;
            transition: transform 0.75s cubic-bezier(0.19, 1, 0.22, 1);
            transform-style: preserve-3d;
        }
        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            background-color: var(--card-bg); border-radius: 20px;
            box-shadow: var(--shadow); border: 2px solid var(--border);
            display: flex; flex-direction: column;
            padding: clamp(14px, 3.2vh, 45px) clamp(20px, 4.4vw, 70px); outline: 3px solid var(--primary); outline-offset: -16px;
        }

        .paper-tag {
            align-self: center;
            background-color: var(--bg);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: clamp(4px, 0.8vh, 7px) clamp(14px, 2.4vw, 32px);
            font-size: clamp(0.95rem, 1.4vw + 0.35rem, 1.5rem);
            font-weight: 700;
            border-radius: 30px;
            margin-bottom: clamp(8px, 1.6vh, 25px);
            letter-spacing: 2px;
            flex-shrink: 0;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 正面大字题干区 */
        .card-front {
            display: flex; flex-direction: column; justify-content: space-between;
        }
        
        .question-body {
            flex: 1; display: flex;
            padding: clamp(4px, 1vh, 10px) clamp(8px, 1.6vw, 20px);
            width: 100%; min-height: 0; overflow-y: auto;
        }
        .question-body::-webkit-scrollbar { width: 6px; }
        .question-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .question-content-layout {
            display: flex; align-items: center; justify-content: center;
            gap: clamp(16px, 2.4vw, 40px); width: 100%; max-width: 1200px; margin: auto;
        }

        .question-img-box {
            flex-shrink: 0; max-width: min(46%, 480px); max-height: clamp(120px, 34vh, 380px);
            border: 3px solid var(--border); border-radius: 12px;
            padding: 8px; background: #fff; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .question-img-box img {
            max-width: 100%; max-height: clamp(100px, 30vh, 360px); object-fit: contain;
            border-radius: 6px; display: block;
        }

        .question-text {
            font-size: clamp(1.4rem, 2.2vw + 1.2vh, 3.1rem);
            line-height: 1.7;
            color: var(--ink);
            font-weight: 700;
            text-align: justify;
            letter-spacing: 2px;
            flex: 1;
        }

        .blank-line {
            display: inline-block; min-width: 3em; border-bottom: 3px solid var(--ink);
            color: transparent; text-align: center; margin: 0 6px; vertical-align: baseline;
        }

        .action-area {
            flex-shrink: 0; padding-top: clamp(6px, 1.2vh, 15px); text-align: center;
        }
        .btn-action {
            background-color: var(--primary); color: #fff; border: none;
            padding: clamp(8px, 1.4vh, 15px) clamp(24px, 3vw, 50px); font-size: clamp(1.15rem, 2.2vh, 1.65rem); font-weight: 900;
            font-family: var(--font-serif); border-radius: 40px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(139, 38, 30, 0.4);
            transition: all 0.2s ease; letter-spacing: 2px;
            animation: pulse 2.2s infinite;
        }
        .btn-action:hover { transform: scale(1.04); background-color: var(--primary-dark); }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(139, 38, 30, 0.6); }
            70% { box-shadow: 0 0 0 16px rgba(139, 38, 30, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 38, 30, 0); }
        }

        /* 背面揭晓卡片 */
        .card-back {
            transform: rotateY(180deg); background-color: var(--bg);
            border: clamp(6px, 1.1vh, 12px) solid var(--card-bg); outline: 2px solid var(--border);
            align-items: center; justify-content: flex-start;
            padding: clamp(14px, 3.2vh, 40px) clamp(18px, 4.2vw, 65px);
        }
        
        .back-content {
            width: 100%; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
            justify-content: flex-start; gap: clamp(12px, 2vh, 24px); padding-right: clamp(4px, 1vw, 15px);
        }
        .back-content::-webkit-scrollbar { width: 6px; }
        .back-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .content-block {
            display: flex; flex-direction: column; align-items: flex-start; width: 100%;
        }

        .section-title {
            font-size: clamp(0.95rem, 1.7vh, 1.4rem); font-weight: 900; color: #fff;
            padding: 4px clamp(10px, 1.6vw, 18px); border-radius: 6px; display: inline-block;
            margin-bottom: clamp(6px, 1vh, 12px); letter-spacing: 2px;
        }
        .bg-green { background-color: var(--success); }
        .bg-red { background-color: var(--primary); }

        .correct-answer-box {
            font-size: clamp(1.3rem, 2.4vh + 0.5vw, 2.7rem);
            font-weight: 800; color: var(--success);
            line-height: 1.6; border-left: clamp(5px, 1vh, 8px) solid var(--success);
            padding: clamp(10px, 1.6vh, 16px) clamp(14px, 1.8vw, 24px); background: rgba(31, 94, 65, 0.05);
            border-radius: 0 12px 12px 0; width: 100%;
            letter-spacing: 2px;
        }

        .analysis-text-box {
            font-size: clamp(0.95rem, 1.5vh + 0.3vw, 1.7rem); font-weight: 500; color: var(--ink);
            line-height: 1.7; border-left: clamp(5px, 1vh, 8px) solid var(--primary);
            padding: clamp(10px, 1.6vh, 16px) clamp(14px, 1.8vw, 24px); background: rgba(139, 38, 30, 0.04);
            border-radius: 0 12px 12px 0; width: 100%;
        }

        /* 导航控制条 */
        .nav-controls {
            display: flex; align-items: center; justify-content: center;
            flex-wrap: wrap; gap: clamp(8px, 1.2vw, 18px); z-index: 100;
            padding-bottom: 5px; flex-shrink: 0;
        }
        .nav-btn {
            background-color: var(--card-bg); border: 2px solid var(--border);
            color: var(--ink); font-size: clamp(1rem, 1.7vh, 1.25rem); font-weight: 700;
            padding: clamp(8px, 1.2vh, 12px) clamp(14px, 2vw, 26px); border-radius: 12px; cursor: pointer;
            flex: 0 0 auto; white-space: nowrap;
            transition: all 0.2s ease; font-family: var(--font-serif);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); letter-spacing: 2px;
        }
        .nav-btn:hover { border-color: var(--primary); color: var(--primary); }
        
        .btn-random { background-color: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-random:hover {
            background-color: var(--primary-dark); color: #fff; transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(139, 38, 30, 0.3);
        }
        
        .nav-select {
            appearance: none; background-color: var(--card-bg); border: 2px solid var(--border);
            color: var(--primary); font-size: clamp(1rem, 1.6vh, 1.35rem); font-weight: 700;
            padding: clamp(8px, 1.2vh, 12px) 40px clamp(8px, 1.2vh, 12px) clamp(12px, 1.6vw, 24px); border-radius: 12px; cursor: pointer;
            flex: 1 1 260px; min-width: 0;
            font-family: var(--font-serif); box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b261e' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 16px center; background-size: 22px;
            text-align: center; letter-spacing: 1px; max-width: min(56vw, 650px);
        }
        .nav-select:focus { outline: none; border-color: var(--primary); }

        /* 翻回正面过程中隐藏答案面，避免下一题答案提前露出 */
        .card.is-navigating .card-back { visibility: hidden; }

        /* 翻页与随机抽查动效 */
        .scene.anim-next { animation: sceneInRight 0.42s cubic-bezier(0.22, 0.9, 0.3, 1); }
        .scene.anim-prev { animation: sceneInLeft 0.42s cubic-bezier(0.22, 0.9, 0.3, 1); }
        .scene.anim-random { animation: scenePop 0.55s cubic-bezier(0.22, 0.9, 0.3, 1); }

        @keyframes sceneInRight {
            from { opacity: 0; transform: translateX(5%) scale(0.975); }
            to   { opacity: 1; transform: none; }
        }
        @keyframes sceneInLeft {
            from { opacity: 0; transform: translateX(-5%) scale(0.975); }
            to   { opacity: 1; transform: none; }
        }
        @keyframes scenePop {
            0%   { opacity: 0; transform: scale(0.9) rotate(-1.2deg); }
            55%  { opacity: 1; transform: scale(1.025) rotate(0.5deg); }
            100% { opacity: 1; transform: none; }
        }

        /* 随机抽查时卡片的抖动 + 标签呼吸 */
        .card.is-roulette { animation: rouletteShake 0.14s linear infinite alternate; }
        @keyframes rouletteShake {
            from { transform: translateX(-7px) rotate(-0.22deg); }
            to   { transform: translateX(7px) rotate(0.22deg); }
        }
        .card.is-roulette .question-body { opacity: 0.4; transition: opacity 0.2s ease; }
        .card.is-roulette .paper-tag { animation: tagGlow 0.3s ease-in-out infinite alternate; }
        @keyframes tagGlow {
            from { box-shadow: 0 0 0 0 rgba(139, 38, 30, 0.3); }
            to   { box-shadow: 0 0 14px 2px rgba(139, 38, 30, 0.35); }
        }

        @media (prefers-reduced-motion: reduce) {
            .scene, .card, .card-face, .paper-tag { animation: none !important; }
            .card { transition-duration: 0.01ms; }
        }

        @media (max-width: 900px), (max-height: 540px) {
            .shortcuts-tip { display: none; }
            .copyright { font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="top-actions">
        <button class="btn-top" id="fullscreenBtn" onclick="toggleFullScreen()">⛶ 全屏显示</button>
    </div>
    <div class="copyright">课件版权©️芦苇语文</div>
    <div class="shortcuts-tip">快捷键：空格键(查看解析/下一题) · ←/→(上一题/下一题)</div>

    <div id="cover-page">
        <div class="cover-badge">高 一 语 文 期 中 备 考</div>
        <div class="cover-title">高一语文上学期·理解性默写<br>期中备考互动课件</div>
        <div class="cover-subtitle">（三大核心题型 · 73题全覆盖）</div>
        <button class="btn-enter" onclick="startApp()">开始闯关</button>
    </div>

    <div id="main-app">
        <div class="scene">
            <div class="card" id="flipCard">
                <div class="card-face card-front">
                    <div class="paper-tag" id="paperTagFront">篇目 · 序号</div>
                    <div class="question-body">
                        <div class="question-content-layout" id="questionLayout"></div>
                    </div>
                    <div class="action-area">
                        <button class="btn-action" onclick="flipTheCard()">揭晓参考答案 (空格键)</button>
                    </div>
                </div>

                <div class="card-face card-back">
                    <div class="paper-tag" id="paperTagBack">篇目 · 序号</div>
                    <div class="back-content">
                        <div class="content-block">
                            <div class="section-title bg-green">【参考答案】</div>
                            <div class="correct-answer-box" id="correctAnswerBox"></div>
                        </div>
                        <div class="content-block">
                            <div class="section-title bg-red">【考点透析与易错字】</div>
                            <div class="analysis-text-box" id="analysisTextBox"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="nav-controls">
            <button class="nav-btn" onclick="prevCard()">上一题</button>
            <select class="nav-select" id="questionSelect" onchange="jumpToCard()"></select>
            <button class="nav-btn btn-random" onclick="randomCard()">🎲 随机抽查</button>
            <button class="nav-btn" onclick="nextCard()">下一题</button>
        </div>
    </div>

    <script>
        const exercisesData = [
            // ==================== 题型1 理解性默写 ====================
            {
                year: "题型1 理解性默写", paper: "第1题 (25-26高一上·山东青岛·期中)",
                question: "《短歌行》中用《诗经》典故，借写姑娘思念情人来表达曹操渴望得到贤才的诗句是：“_________，_________。”",
                answer: "①. 青青子衿    ②. 悠悠我心",
                analysis: "考查《短歌行》化用《诗经》典故表达求贤若渴之情。易错字：衿（衣字旁，不可写成“矜”）、悠。", image: null
            },
            {
                year: "题型1 理解性默写", paper: "第2题 (25-26高一上·山东青岛·期中)",
                question: "《短歌行》中“_________，_________”两句诗，模仿了《管子·形势解》的“海不辞水，故能成其大；山不辞土石，故能成其高”。",
                answer: "①. 山不厌高    ②. 海不厌深",
                analysis: "考查曹操表达宽广胸襟和招纳贤才的决心。易错字：厌（意为满足）。", image: null
            },
            {
                year: "题型1 理解性默写", paper: "第3题 (25-26高一上·山东青岛·期中)",
                question: "《归园田居》（其一）中“_________，_________”两句使用叠词，增添了乡村远景的平静安详之感。",
                answer: "①. 暧暧远人村    ②. 依依墟里烟",
                analysis: "描绘恬静优美的田园风光。易错字：暧暧（日字旁，意为昏暗不明）、墟里（村落）。", image: null
            },
            {
                year: "题型1 理解性默写", paper: "第4题 (25-26高一上·山东青岛·期中)",
                question: "《静女》中写女子约会调皮躲藏令男子焦急挠头的场景的诗句是：“_________，_________。”",
                answer: "①. 爱而不见    ②. 搔首踟蹰",
                analysis: "生动刻画恋爱中男子的憨态。易错字：爱（通“薆”，隐藏）、踟蹰（chí chú，足字旁）。", image: null
            },
            {
                year: "题型1 理解性默写", paper: "第5题 (25-26高一上·山东青岛·期中)",
                question: "《涉江采芙蓉》中通过设问表达思念的句子是：“_________？_________。”",
                answer: "①. 采之欲遗谁    ②. 所思在远道",
                analysis: "考查古诗中典型的抒情设问。易错字：遗（wèi，赠送）。", image: null
            },
            {
                year: "题型1 理解性默写", paper: "第6题 (26-27高一上·陕西渭南·期中)",
                question: "《沁园春·长沙》上阕写景的角度和手法多样，其中运用对偶的修辞手法描写动态之景的句子是“_________，_________”。",
                answer: "①. 鹰击长空    ②. 鱼翔浅底",
                analysis: "考查对偶句及动词的精准运用（击、翔）。易错字：翔。", image: null
            },
            {
                year: "题型1 理解性默写", paper: "第7题 (26-27高一上·陕西渭南·期中)",
                question: "《沁园春·长沙》中，“_________，_________”两句化用祖逖“中流击楫”的典故，运用夸张手法写出了劈波斩浪、不畏艰险的革命精神。",
                answer: "①. 到中流击水    ②. 浪遏飞舟",
                analysis: "化用典故抒发革命豪情。易错字：遏（阻挡）。", image: null
            },

        const questionSelect = document.getElementById('questionSelect');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        function initApp() {
            const groups = new Map();
            exercisesData.forEach((item, index) => {
                let group = groups.get(item.year);
                if (!group) {
                    group = document.createElement('optgroup');
                    group.label = item.year;
                    questionSelect.appendChild(group);
                    groups.set(item.year, group);
                }
                const opt = document.createElement('option');
                opt.value = index;
                const num = (index + 1).toString().padStart(3, '0');
                opt.innerText = `第${num}题 · ${item.paper.replace(/^第\s*\d+\s*题\s*/, '')}`;
                group.appendChild(opt);
            });
            setupCard(0);
        }

        function startApp() {
            if (appStarted) return;
            appStarted = true;
            coverPage.style.opacity = '0';
            coverPage.style.visibility = 'hidden';
            setTimeout(() => {
                mainApp.style.opacity = '1';
                mainApp.style.visibility = 'visible';
            }, 500);
        }

        function formatQuestionText(text) {
            return text.replace(/[_＿]{2,}/g, '<span class="blank-line">&nbsp;</span>');
        }

        function renderCard(index) {
            currentIndex = index;
            questionSelect.value = index;

            const data = exercisesData[index];
            const tag = `📜 ${data.year} · ${data.paper}`;
            paperTagFront.innerText = tag;
            paperTagBack.innerText = tag;

            questionLayout.innerHTML = '';
            if (data.image) {
                const imgBox = document.createElement('div');
                imgBox.className = 'question-img-box';
                const img = document.createElement('img');
                img.src = data.image;
                img.alt = '试题配图';
                imgBox.appendChild(img);
                questionLayout.appendChild(imgBox);
            }

            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = formatQuestionText(data.question);
            questionLayout.appendChild(qText);

            correctAnswerBox.innerHTML = data.answer.replace(/\n/g, '<br>');
            analysisTextBox.innerHTML = data.analysis.replace(/\n/g, '<br>');

            document.querySelector('.question-body').scrollTop = 0;
            document.querySelector('.back-content').scrollTop = 0;
        }

        function resetFlip() {
            flipCard.classList.remove('flipped');
            isCardFlipped = false;
        }

        function setupCard(index) {
            renderCard(index);
            resetFlip();
        }

        function playSceneAnim(dir) {
            scene.classList.remove('anim-next', 'anim-prev', 'anim-random');
            void scene.offsetWidth;
            scene.classList.add('anim-' + dir);
        }

        scene.addEventListener('animationend', (e) => {
            if (e.target === scene) scene.classList.remove('anim-next', 'anim-prev', 'anim-random');
        });

        function flipTheCard() {
            if (!appStarted || isRoulette) return;
            if (isCardFlipped) {
                nextCard();
            } else {
                clearTimeout(navTimer);
                flipCard.classList.remove('is-navigating');
                flipCard.classList.add('flipped');
                isCardFlipped = true;
            }
        }

        function switchCard(newIndex, dir) {
            if (newIndex === currentIndex) {
                if (isCardFlipped) resetFlip();
                return;
            }
            const prevIndex = currentIndex;
            const wasFlipped = isCardFlipped;
            renderCard(newIndex);
            playSceneAnim(dir || (newIndex > prevIndex ? 'next' : 'prev'));
            if (wasFlipped) {
                clearTimeout(navTimer);
                flipCard.classList.add('is-navigating');
                resetFlip();
                navTimer = setTimeout(() => flipCard.classList.remove('is-navigating'), 800);
            }
        }

        function stopRoulette() {
            if (rouletteTimer) {
                clearInterval(rouletteTimer);
                rouletteTimer = null;
            }
            if (isRoulette) {
                isRoulette = false;
                flipCard.classList.remove('is-roulette');
            }
        }

        function prevCard() {
            stopRoulette();
            let idx = currentIndex - 1;
            if (idx < 0) idx = exercisesData.length - 1;
            switchCard(idx, 'prev');
        }

        function nextCard() {
            stopRoulette();
            let idx = currentIndex + 1;
            if (idx >= exercisesData.length) idx = 0;
            switchCard(idx, 'next');
        }

        function randomCard() {
            const count = exercisesData.length;
            if (isRoulette || count < 2) return;

            let idx = currentIndex;
            while (idx === currentIndex) {
                idx = Math.floor(Math.random() * count);
            }

            // 先快速滚动题号再落定，形成"抽签"效果
            isRoulette = true;
            flipCard.classList.add('is-roulette');
            if (isCardFlipped) {
                clearTimeout(navTimer);
                flipCard.classList.add('is-navigating');
                resetFlip();
                navTimer = setTimeout(() => flipCard.classList.remove('is-navigating'), 800);
            }

            let ticks = 0;
            const totalTicks = 9;
            rouletteTimer = setInterval(() => {
                ticks++;
                if (ticks >= totalTicks) {
                    stopRoulette();
                    switchCard(idx, 'random');
                    return;
                }
                const num = (Math.floor(Math.random() * count) + 1).toString().padStart(3, '0');
                const tag = `🎲 随机抽查中 · 第 ${num} 题`;
                paperTagFront.innerText = tag;
                paperTagBack.innerText = tag;
            }, 60);
        }

        function jumpToCard() {
            stopRoulette();
            switchCard(parseInt(questionSelect.value, 10));
            questionSelect.blur();
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            fullscreenBtn.innerText = document.fullscreenElement ? '🗗 退出全屏' : '⛶ 全屏显示';
        });

        window.addEventListener('keydown', (e) => {
            if (!appStarted || e.repeat) return;
            if (document.activeElement === questionSelect) return;
            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                e.preventDefault();
                nextCard();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                prevCard();
            } else if (e.key === ' ') {
                e.preventDefault();
                flipTheCard();
            }
        });

        initApp();
    </script>
</body>
</html>
